<div class="trend-chart">
  <div class="trend-header">
    <span class="trend-label">{{ label }}</span>
    <span class="trend-value" [style.color]="color">{{ latestValue() | number: '1.0-1' }}</span>
  </div>
  <svg viewBox="0 0 280 80" preserveAspectRatio="none">
    <polyline
      [attr.points]="points()"
      fill="none"
      [attr.stroke]="color"
      stroke-width="2.5"
    />
  </svg>
</div>
