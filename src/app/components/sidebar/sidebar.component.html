<nav class="sidebar">
  @for (item of navItems; track item.label; let i = $index) {
    <button
      class="nav-item"
      [class.active]="activeIndex() === i"
      (click)="select(i)"
    >
      <span class="nav-icon" [innerHTML]="item.icon"></span>
      <span class="nav-label">{{ item.label }}</span>
    </button>
  }
</nav>
